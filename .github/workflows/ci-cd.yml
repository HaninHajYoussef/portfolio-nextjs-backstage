name: CI/CD Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer la version
        run: echo "VERSION=v" >> $GITHUB_ENV

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: 
          password: 

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            /portfolio-nextjs:
            /portfolio-nextjs:latest
